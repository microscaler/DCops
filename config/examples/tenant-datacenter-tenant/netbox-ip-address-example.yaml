apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPAddress
metadata:
  name: web-server-ip
  namespace: default
spec:
  address: 192.168.1.10/24
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  vlan:
    apiGroup: dcops.microscaler.io
    kind: NetBoxVLAN
    name: web-vlan
    namespace: default
  status: active
  role: vip
  dnsName: web-server.example.com
  description: "Web server IP description for monitoring"
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: managed-by-dcops
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: production
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: web-server
    namespace: default
  comments: Assigned to web-server-01 for production traffic
  driftDetection: true
