              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /imports:
    post:
      operationId: create_import
      tags:
      - Imports
      summary: 'Register a scan upload: validates metadata, sniffs the sample, dedupes by sha256, returns a one-time signed
        PUT URL. Requires role dcops:certificates:import.'
      security:
      - BearerAuth: []
      x-cors: inherit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportRequest'
            example:
              filename: certificates.csv
              sizeBytes: 1079797
              contentSha256: 9f1caaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              contentType: text/csv
              namespace: certificates
              note: September BitSight export
              sample: YXV0aG9ycy5tZXRyby12dG8uZXMsMTEs…
      responses:
        '201':
          description: New import awaiting upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
              example:
                importId: 01J7QZ3M8V2K7Y9XQ4B1F0C2D3
                phase: AwaitingUpload
                upload:
                  url: https://storage.googleapis.com/dcops-imports-prod/imports/certificates/01J7QZ…/scan.csv?X-Goog-Algorithm=GOOG4-RSA-SHA256&…
                  method: PUT
                  headers:
                    Content-Type: text/csv
                    Content-Length: '1079797'
                    x-goog-if-generation-match: '0'
                  expiresAt: '2026-09-08T08:46:00Z'
                statusUrl: /api/v1/certificates/imports/01J7QZ…
                previewUrl: /api/v1/certificates/imports/01J7QZ…/preview
                eventsUrl: /api/v1/certificates/imports/01J7QZ…/events
        '200':
          description: Same file already imported within 24 h; existing import returned, no new upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
              example:
                importId: 01J7QZ3M8V2K7Y9XQ4B1F0C2D3
                phase: Completed
                upload: null
                statusUrl: /api/v1/certificates/imports/01J7QZ…
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: payload_too_large
                message: File too large
                requestId: req-01J9Z3Q8K7
        '415':
          description: Content type not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unsupported_media_type
                message: Content type not allowed
                requestId: req-01J9Z3Q8K7
        '422':
          description: The file does not look like a scan export we know; mapping[] carries the best-guess column mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unknown_format
                message: The file does not look like a scan export we know; mapping[] carries the best-guess column mapping
                requestId: req-01J9Z3Q8K7
        '503':
          description: Upload store unavailable (signing failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unavailable
                message: Upload store unavailable (signing failed)
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
    get:
      operationId: list_imports
      tags:
      - Imports
      summary: Import history, newest first
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - name: phase
        in: query
        required: false
        schema:
