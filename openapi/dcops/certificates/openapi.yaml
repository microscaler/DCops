              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /inventory/{namespace}/{name}:
    get:
      operationId: get_certificate
      tags:
      - Inventory
      summary: 'Record detail: observed vs expected, plain-language status, planned action'
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/pathNamespace'
      - $ref: '#/components/parameters/pathName'
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDetail'
              example:
                name: www-dev.metro-vto.es
                namespace: certificates
                bucket: legacy
                issuanceMode: external
                state: Renewal due
                maturityLevel: 2
                ownership:
                  team: Network
                  contact: net-oncall@example.com
                  escalation:
                  - after: 14d
                    to: platform-lead@example.com
                  - after: 7d
                    to: security@example.com
                  businessUnits:
                  - METRO France
                  - METRO digital
                  environment: production
                acknowledgement: null
                observedVsExpected:
                - field: fingerprint
                  observed: AB:CD:12:…:9F
                  expected: AB:CD:12:…:9F
                  result: matches
                - field: expires
                  observed: 2026-09-14 · 6 days
                  expected: '> 30 days (policy)'
                  result: breach
                statusLines:
                - badge: Renewal due
                  tone: warn
                  text: Renewal is due — 6 days left. Escalation to platform-lead@ in 24 h if unacknowledged.
                plannedAction:
                  recommendedAction: Onboard certificate and owner into central lifecycle management
                  nextReminder: in 6 days → expiry
                  escalatesTo: platform-lead@example.com
                  sopUrl: https://wiki.example.com/certs/legacy-renewal
                endpoints:
                - host: www-dev.metro-vto.es
                  port: 443
                  sni: www-dev.metro-vto.es
                certManagerRef: null
                conditions:
                - type: OwnerAssigned
                  status: 'True'
                - type: Expiring
                  status: 'True'
                  reason: Below7Days
                lastProbedAt: '2026-09-08T08:40:12Z'
                nextProbeAt: '2026-09-08T14:40:12Z'
        '404':
          description: No such certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: not_found
                message: No such certificate
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
