apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPAddress
metadata:
  name: dhcp-server-ip
  namespace: default
spec:
  # Static DHCP reservation using interface reference
  # This is an alternative to using macAddress - directly reference the interface
  address: "192.168.1.1/24"
  
  # Direct interface reference (alternative to MAC address)
  # If both macAddress and interface are specified, interface takes precedence
  interface:
    apiGroup: dcops.microscaler.io
    kind: NetBoxInterface
    name: eth0
    namespace: default
  
  # IP range reference (optional, for validation)
  # If specified, the address must be within this range
  ipRange:
    apiGroup: dcops.microscaler.io
    kind: NetBoxIPRange
    name: dhcp-pool-range
    namespace: default
  
  # Tenant reference (required)
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  
  # VLAN reference (optional)
  vlan:
    apiGroup: dcops.microscaler.io
    kind: NetBoxVLAN
    name: server-vlan
    namespace: default
  
  # IP address status: dhcp (for DHCP-assigned addresses)
  # This indicates the IP was assigned via DHCP, not statically configured
  # Options: active, reserved, deprecated, dhcp, slaac
  status: dhcp
  
  # IP address role (optional)
  # Options: loopback, secondary, anycast, vip, vrrp, hsrp, glbp, carp
  
  # DNS name (optional)
  dnsName: "dhcp-server.example.com"
  
  # Description (optional)
  description: "DHCP server IP assigned to interface"
  
  # Tag references (optional)
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: dhcp-managed
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: server
      namespace: default
  
  # Comments (optional)
  comments: "DHCP server IP statically reserved for this interface. The IP is assigned to the interface in NetBox."

  # NOTE: For static DHCP reservations:
  # - Option 1: Use macAddress (reconciler will query NetBox to find interface)
  # - Option 2: Use interface (direct reference, takes precedence over macAddress)
  # - Both require address to be specified
  #
  # The reconciler will assign the IP to the interface in NetBox using
  # assigned_object_type: "dcim.interface" and assigned_object_id: <interface_id>
  #
  # For random DHCP allocation, see:
  # netbox-ip-address-dhcp-random-example.yaml

