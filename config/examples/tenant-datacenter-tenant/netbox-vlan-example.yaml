apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxVLAN
metadata:
  name: control-plane-vlan
  namespace: default
spec:
  vid: 100
  name: Control Plane VLAN
  site:
    apiGroup: dcops.microscaler.io
    kind: NetBoxSite
    name: datacenter-1
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
  role:
    apiGroup: dcops.microscaler.io
    kind: NetBoxRole
    name: control-plane
  status: active
  description: VLAN for Kubernetes control plane traffic
  comments: Managed by DCops
  driftDetection: true
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: managed-by-dcops
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: production
    namespace: default
