components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
        mapping:
          type: array
          description: 'On unknown_format: the best-guess column mapping so the manager can see what was detected'
          items:
            $ref: '#/components/schemas/CertificatesColumnMapping'
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
      properties:
        type:
          type: string
        status:
          type: string
          enum:
          - 'True'
          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: Total matching items
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page
    KindCount:
      type: object
      required:
      - kind
      - plural
      - segment
      - count
      properties:
        kind:
          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    PlatformCategoryCount:
      type: object
      required:
      - category
      - service
      - kinds
      - count
      properties:
        category:
          type: string
          enum:
          - ipam
          - dcim
          - tenancy
          - extras
          - boot
          - ippools
          - certificates
        service:
          type: string
          description: BFF service that serves the category
        kinds:
          type: integer
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    PlatformAttentionItem:
      type: object
      required:
      - kind
      - segment
      - service
      - metadata
      - state
      properties:
        kind:
          type: string
        service:
          type: string
        segment:
          type: string
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        since:
          type:
          - string
          - 'null'
          format: date-time
    PlatformMe:
      type: object
      required:
      - subject
      - displayName
      - roles
      properties:
        subject:
          type: string
        displayName:
          type: string
        email:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
          description: DCops roles after the claim→role mapping, e.g. dcops:certificates:import
        idp:
          type: string
          description: Issuer the token was validated against
    PlatformKindDescriptor:
      type: object
      required:
      - kind
      - plural
      - category
      - service
      - segment
      - listPath
      - description
      properties:
        kind:
          type: string
        plural:
          type: string
        category:
          type: string
        service:
          type: string
        segment:
          type: string
        listPath:
          type: string
          description: BFF path that lists this kind
        description:
