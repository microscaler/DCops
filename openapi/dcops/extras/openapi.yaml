openapi: 3.1.0
info:
  title: DCops — Extras (NetBox tags)
  version: 0.1.0
  description: |-
    Extras (NetBox tags). Paths are service-relative; the BFF adds /api/v1/extras (bff-suite-config.yaml).
    Generated by openapi/dcops/scripts/build_specs.py from config/crd/all-crds.yaml and the screen contracts in
    docs/03_ui_design — do not edit by hand. Version policy: stay on 3.1.0.
tags:
- name: Tag
  description: NetBoxTag (netboxtags.dcops.microscaler.io/v1alpha1)
paths:
  /tags:
    get:
      operationId: list_tags
      tags:
      - Tag
      summary: List NetBoxTag resources as table rows
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: NetBoxTag rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
              example:
                items:
                - metadata:
                    name: tag-1
                    namespace: default
                    uid: 2a1f0c7e-1
                    creationTimestamp: '2026-09-01T10:00:00Z'
                  state: Created
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  netboxId: 42
                  netboxUrl: http://netbox.netbox/api/netboxtags/42/
                  spec:
                    color: example
                    comments: Example description
                    description: Example description
                    driftDetection: true
                    name: example
                    slug: example
                    tenant: example
                page:
                  total: 1
                  nextCursor: null
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /tags/{namespace}/{name}:
    get:
      operationId: get_tag
      tags:
      - Tag
      summary: Get one NetBoxTag with status, conditions and manifest
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/pathNamespace'
      - $ref: '#/components/parameters/pathName'
      responses:
        '200':
          description: NetBoxTag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDetail'
              example:
                apiVersion: dcops.microscaler.io/v1alpha1
                kind: NetBoxTag
                metadata:
                  name: tag-1
                  namespace: default
                  uid: 2a1f0c7e-1
                  creationTimestamp: '2026-09-01T10:00:00Z'
                spec:
                  color: example
                  comments: Example description
                  description: Example description
                  driftDetection: true
                  name: example
                  slug: example
                  tenant:
                    apiGroup: example
                    kind: example
                    name: example
                    namespace: example
                status:
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  netboxId: 42
                  netboxUrl: http://netbox.netbox/api/dcim/sites/42/
                  state: Pending
                conditions:
                - type: Ready
                  status: 'True'
                  reason: Reconciled
                  message: present in NetBox
                  lastTransitionTime: '2026-09-08T08:41:12Z'
                manifestYaml: |
                  apiVersion: dcops.microscaler.io/v1alpha1
                  kind: NetBoxTag
                  metadata:
                    name: tag-1
                    namespace: default
                  spec:
                    color: example
                    comments: Example description
                    description: Example description
                    driftDetection: true
                    name: example
                    slug: example
                    tenant:
                      apiGroup: example
                      kind: example
                      name: example
                      namespace: example
                gitUrl: null
        '404':
          description: No such resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: not_found
                message: No such resource
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /summary:
    get:
      operationId: get_extras_summary
      tags:
      - Summary
      summary: Counts per kind and state for the extras section landing page
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Per-kind counts
          content:
            application/json:
              schema:
                type: object
                required:
                - kinds
                - total
                properties:
                  total:
                    type: integer
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/KindCount'
              example:
                total: 1
                kinds:
                - kind: NetBoxTag
                  plural: netboxtags
                  segment: tags
                  count: 1
                  byState:
                    Created: 1
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
      properties:
        type:
          type: string
        status:
          type: string
          enum:
          - 'True'
          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: Total matching items
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page
    KindCount:
      type: object
      required:
      - kind
      - plural
      - segment
      - count
      properties:
        kind:
          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    TagSpec:
      description: NetBoxTagSpec defines the desired state of a NetBox tag
      properties:
        color:
          description: Tag color (hex color code, e.g., "9e9e9e")
          type:
          - string
          - 'null'
        comments:
          description: Comments
          type:
          - string
          - 'null'
        description:
          description: Description of the tag
          type:
          - string
          - 'null'
        driftDetection:
          default: true
          description: |-
            Enable drift detection (default: true)

            When enabled, the reconciler will detect and correct any changes made to the resource
            in the NetBox UI that differ from the CRD spec. Git is the source of truth.
            Set to false to disable drift detection (not recommended for GitOps workflows).
          type:
          - boolean
          - 'null'
        name:
          description: Tag name
          type: string
        slug:
          description: Tag slug (optional, auto-generated from name if not provided)
          type:
          - string
          - 'null'
        tenant:
          description: |-
            Tenant reference (optional)

            If specified, the tag will be managed using this tenant's NetBox API token.
            If not specified, the controller will attempt to find a tenant from resources
            that reference this tag, or fall back to the system tenant.

            Note: Tags in NetBox are global resources and don't have a tenant field.
            This field only determines which API token to use for tag operations.
          properties:
            apiGroup:
              description: API group of the referenced resource (e.g., "dcops.microscaler.io")
              type: string
            kind:
              description: Kind of the referenced resource (e.g., "NetBoxSite", "NetBoxTenant")
              type: string
            name:
              description: Name of the referenced NetBox CRD resource
              type: string
            namespace:
              description: Namespace of the referenced resource (defaults to same namespace as the referencing resource)
              type:
              - string
              - 'null'
          required:
          - apiGroup
          - kind
          - name
          type:
          - object
          - 'null'
      required:
      - name
      type: object
    TagStatus:
      description: NetBoxTagStatus defines the observed state of a NetBox tag
      properties:
        error:
          description: Error message if reconciliation failed
          type:
          - string
          - 'null'
        lastReconciled:
          description: Last reconciliation timestamp
          format: date-time
          type:
          - string
          - 'null'
        netboxId:
          description: NetBox tag ID (set after creation)
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        netboxUrl:
          description: NetBox tag URL
          type:
          - string
          - 'null'
        state:
          description: Current state of the tag
          enum:
          - Pending
          - Created
          - Updated
          - Failed
          type: string
      required:
      - state
      type:
      - object
      - 'null'
    TagRow:
      type: object
      required:
      - metadata
      - state
      - spec
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        netboxUrl:
          type:
          - string
          - 'null'
        spec:
          type: object
          description: Scalar spec fields for table columns
          properties:
            color:
              description: Tag color (hex color code, e.g., "9e9e9e")
              type:
              - string
              - 'null'
            comments:
              description: Comments
              type:
              - string
              - 'null'
            description:
              description: Description of the tag
              type:
              - string
              - 'null'
            driftDetection:
              default: true
              description: |-
                Enable drift detection (default: true)

                When enabled, the reconciler will detect and correct any changes made to the resource
                in the NetBox UI that differ from the CRD spec. Git is the source of truth.
                Set to false to disable drift detection (not recommended for GitOps workflows).
              type:
              - boolean
              - 'null'
            name:
              description: Tag name
              type: string
            slug:
              description: Tag slug (optional, auto-generated from name if not provided)
              type:
              - string
              - 'null'
            tenant:
              type:
              - string
              - 'null'
              description: Tenant reference (optional) (name of the referenced resource)
    TagDetail:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: dcops.microscaler.io/v1alpha1
        kind:
          type: string
          const: NetBoxTag
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/TagSpec'
        status:
          oneOf:
          - $ref: '#/components/schemas/TagStatus'
          - type: 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        manifestYaml:
          type: string
          description: The declared resource as YAML (spec only), for the Manifest panel
        gitUrl:
          type:
          - string
          - 'null'
          description: Link to the declaring file in the GitOps repository when known
    TagList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagRow'
        page:
          $ref: '#/components/schemas/PageInfo'
  parameters:
    namespace:
      name: namespace
      in: query
      required: false
      description: Restrict to one namespace; absent = all namespaces the caller may read
      schema:
        type: string
    state:
      name: state
      in: query
      required: false
      description: Filter by reconciliation state
      schema:
        type: string
        enum:
        - Pending
        - Created
        - Updated
        - Failed
        description: Reconciliation state written by the controller
    search:
      name: search
      in: query
      required: false
      description: Case-insensitive match on name and the kind's primary field
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor from a previous page
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Field name, prefix with - for descending
      schema:
        type: string
        default: name
    pathNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    pathName:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token (Microsoft Entra ID or Sesame-IDAM); validated against the configured JWKS
