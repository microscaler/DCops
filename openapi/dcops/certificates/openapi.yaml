  /maturity:
    get:
      operationId: get_maturity
      tags:
      - Maturity
      summary: Estate maturity on the CMMI scale, KPIs and grouped breakdown
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - name: environment
        in: query
        required: false
        schema:
          type: string
      - name: groupBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - owner_team
          - business_unit
          - bucket
          default: owner_team
      responses:
        '200':
          description: Maturity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaturitySummary'
              example:
                estateLevel: 1
                pinnedBy: 2,829 unowned certificates, 137 of them critical
                distribution:
                  level1: 2829
                  level2: 1340
                  level3: 640
                  level4: 320
                  level5: 239
                kpis:
                  ownerCoveragePercent: 47.3
                  renewalHeadroomPercent: 87.6
                  automationCoveragePercent: 77.5
                  medianTimeToRotateHours: null
                groupBy: owner_team
                groups:
                - name: Platform
                  certificates: 1204
                  critical: 12
                  headroomPercent: 98
                  automatedPercent: 91
                  level: 4
                - name: null
                  certificates: 2829
                  critical: 137
                  headroomPercent: 81
                  automatedPercent: 74
                  level: 1
                computedAt: '2026-09-08T08:41:12Z'
        '401':
          description: Missing or invalid bearer token
