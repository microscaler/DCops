apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxSiteGroup
metadata:
  name: production-sites
  namespace: default
spec:
  name: "Production Sites"
  slug: "production-sites"
  description: "Production datacenter sites"
  # Optional: parent site group for hierarchical organization
  # parent:
  #   apiGroup: "dcops.microscaler.io"
  #   kind: "NetBoxSiteGroup"
  #   name: "all-sites"
  # Tag references (optional)
  # Tags must exist in NetBox before they can be referenced
  # See netbox-tag-example.yaml for creating tags
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: managed-by-dcops
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: production
      namespace: default

