apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxInterface
metadata:
  name: talos-control-plane-01-eth0
  namespace: default
spec:
  device: talos-control-plane-01
  name: eth0
  type: 1000base-t
  enabled: true
  macAddress: aa:bb:cc:dd:ee:ff
  mtu: 1500
  description: Primary Ethernet interface for control plane node
  comments: Primary Ethernet interface for Kubernetes control plane node. Managed
    by DCops controller.
  driftDetection: true
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: managed-by-dcops
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: production
    namespace: default
