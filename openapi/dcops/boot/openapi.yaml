                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
