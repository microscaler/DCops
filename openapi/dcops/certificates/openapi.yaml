components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
        mapping:
          type: array
          description: 'On unknown_format: the best-guess column mapping so the manager can see what was detected'
          items:
            $ref: '#/components/schemas/ColumnMapping'
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
