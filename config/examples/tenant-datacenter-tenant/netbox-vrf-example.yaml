apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxVRF
metadata:
  name: production-vrf
  namespace: default
spec:
  name: Production VRF
  rd: '65000:1'
  enforceUnique: true
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  description: Production VRF for customer-facing services and infrastructure
  comments: 'This VRF is used for:

    - Customer-facing production services

    - Core infrastructure routing

    - Inter-site connectivity via MPLS/BGP


    Network topology:

    - Connected to 3 datacenters

    - 50+ prefixes managed

    - 200+ IP addresses allocated


    Managed by DCops automation system.

    Last updated: 2024-01-15

    Contact: network-team@example.com

    '
  driftDetection: true
  importTargets:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxRouteTarget
    name: production-rt-65000-100
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxRouteTarget
    name: shared-services-rt-65000-200
    namespace: default
  exportTargets:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxRouteTarget
    name: production-rt-65000-100
    namespace: default
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: managed-by-dcops
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: production
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: vrf
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: mpls-enabled
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: bgp-evpn
    namespace: default
