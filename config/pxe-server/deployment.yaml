apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxe-server
  namespace: dcops-system
  labels:
    app: pxe-server
    app.kubernetes.io/part-of: dcops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pxe-server
  template:
    metadata:
      labels:
        app: pxe-server
        app.kubernetes.io/part-of: dcops
    spec:
      serviceAccountName: pxe-server
      initContainers:
        - name: seed-ipxe-scripts
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/pxe/ipxe /var/lib/pxe/cylon-regenesis
              cp /seed/cylon-resurrection.ipxe /var/lib/pxe/ipxe/
              cp /seed/localboot.ipxe /var/lib/pxe/ipxe/
          volumeMounts:
            - name: pxe-root
              mountPath: /var/lib/pxe
            - name: pxe-ipxe-scripts
              mountPath: /seed
      containers:
        - name: pxe-server
          image: pxe-server
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PXE_ROOT
              value: /var/lib/pxe
            - name: HTTP_LISTEN
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: pxe-root
              mountPath: /var/lib/pxe
      volumes:
        - name: pxe-root
          emptyDir: {}
        - name: pxe-ipxe-scripts
          configMap:
            name: pxe-ipxe-scripts
