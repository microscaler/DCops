# Dev edge — Envoy Gateway (shared-gitops-k8s-cluster stack envoy-gateway).
# Envoy does not consume networking.k8s.io Ingress; wiring is HTTPRoute + parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dcops-dashboard
  namespace: dcops-system
  labels:
    app: dcops-dashboard
    app.kubernetes.io/part-of: dcops
  annotations:
    gitops.microscaler.io/hostname: dcops.dev.microscaler.local/dashboard
    gitops.microscaler.io/gateway: microscaler-dev
spec:
  parentRefs:
    - name: microscaler-dev
      namespace: envoy-gateway-system
      sectionName: https
    - name: microscaler-dev
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - dcops.dev.microscaler.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dashboard
      backendRefs:
        - name: dcops-dashboard
          port: 8080
