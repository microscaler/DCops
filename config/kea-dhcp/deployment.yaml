apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcp
  namespace: dcops-system
  labels:
    app: kea-dhcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kea-dhcp
  template:
    metadata:
      labels:
        app: kea-dhcp
    spec:
      containers:
      - name: kea-dhcp4
        image: 10.177.76.220:5000/kea-dhcp:latest
        imagePullPolicy: Always
        ports:
        - name: dhcp
          containerPort: 67
          protocol: UDP
        - name: control-agent
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: kea-config
          mountPath: /etc/kea
        - name: kea-run
          mountPath: /var/run/kea
        command:
        - /bin/bash
        - -c
        - |
          chmod 750 /var/run/kea
          kea-dhcp4 -c /etc/kea/kea-dhcp4.conf &
          sleep 2
          exec kea-ctrl-agent -c /etc/kea/kea-ctrl-agent.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
      volumes:
      - name: kea-config
        configMap:
          name: kea-dhcp-config
      - name: kea-run
        emptyDir: {}
