              example:
                apiVersion: dcops.microscaler.io/v1alpha1
                kind: BootProfile
                metadata:
                  name: boot-profile-1
                  namespace: default
                  uid: 2a1f0c7e-1
                  creationTimestamp: '2026-09-01T10:00:00Z'
                spec:
                  cmdline: ''
                  initrd: []
                  kernel: example
                  message: example
                  schematicId: example
                status:
                  lastReconciled: '2026-09-08T08:41:12Z'
                  ready: false
                conditions:
                - type: Ready
                  status: 'True'
                  reason: Reconciled
                  message: present in NetBox
                  lastTransitionTime: '2026-09-08T08:41:12Z'
                manifestYaml: |
                  apiVersion: dcops.microscaler.io/v1alpha1
                  kind: BootProfile
                  metadata:
                    name: boot-profile-1
                    namespace: default
                  spec:
                    cmdline: ''
                    initrd: []
                    kernel: example
