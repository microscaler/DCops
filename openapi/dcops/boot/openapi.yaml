openapi: 3.1.0
info:
  title: DCops — PXE boot control
  version: 0.1.0
  description: |-
    PXE boot control. Paths are service-relative; the BFF adds /api/v1/boot (bff-suite-config.yaml).
    Generated by openapi/dcops/scripts/build_specs.py from config/crd/all-crds.yaml and the screen contracts in
    docs/03_ui_design — do not edit by hand. Version policy: stay on 3.1.0.
tags:
- name: BootProfile
  description: BootProfile (bootprofiles.dcops.microscaler.io/v1alpha1)
- name: BootIntent
  description: BootIntent (bootintents.dcops.microscaler.io/v1alpha1)
