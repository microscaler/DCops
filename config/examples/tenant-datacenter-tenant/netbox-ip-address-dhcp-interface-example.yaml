apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPAddress
metadata:
  name: dhcp-server-ip
  namespace: default
spec:
  address: 192.168.1.100/24
  interface:
    apiGroup: dcops.microscaler.io
    kind: NetBoxInterface
    name: eth0
    namespace: default
  ipRange:
    apiGroup: dcops.microscaler.io
    kind: NetBoxIPRange
    name: dhcp-pool-range
    namespace: default
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  vlan:
    apiGroup: dcops.microscaler.io
    kind: NetBoxVLAN
    name: server-vlan
    namespace: default
  status: dhcp
  dnsName: dhcp-server.example.com
  description: DHCP server IP assigned to interface
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: dhcp-managed
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: server
    namespace: default
  comments: DHCP server IP statically reserved for this interface. The IP is assigned
    to the interface in NetBox.
  driftDetection: true
