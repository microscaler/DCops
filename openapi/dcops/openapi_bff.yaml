          description: Reproduces the inventory table filters
          properties:
            namespace:
              type: string
            state:
              $ref: '#/components/schemas/CertificatesCertState'
            bucket:
              $ref: '#/components/schemas/CertificatesBucket'
            owner:
              type: string
              description: Team name, or "none" for unowned
            severity:
              type: string
            businessUnit:
              type: string
            search:
              type: string
        names:
          type: array
          items:
            type: string
          maxItems: 2000
        ownership:
          $ref: '#/components/schemas/CertificatesOwnership'
        bucket:
          $ref: '#/components/schemas/CertificatesBucket'
        dryRun:
          type: boolean
    CertificatesBulkOwnershipResult:
      type: object
      required:
      - matched
      - updated
      - skipped
      - failed
      - dryRun
      description: With dryRun=true, updated/skipped are the would-update/would-skip counts and failed is always empty
      properties:
        matched:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        failed:
          type: array
          description: Records the apply run could not update (409 from SSA, transient errors); empty on dry run
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        dryRun:
          type: boolean
        skippedReasons:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
    CertificatesCertificatesSummary:
      type: object
      required:
      - total
      - unowned
      - renewalDue30d
      - drift
      - failed
      - estateLevel
      properties:
        total:
          type: integer
        unowned:
          type: integer
        renewalDue30d:
          type: integer
        drift:
          type: integer
        failed:
          type: integer
        stale:
          type: integer
        estateLevel:
          type: integer
          minimum: 1
          maximum: 5
        byBucket:
          type: object
          additionalProperties:
            type: integer
        refreshedAt:
          type: string
          format: date-time
    CertificatesMaturitySummary:
      type: object
      required:
      - estateLevel
      - distribution
      - kpis
      - groups
      properties:
        estateLevel:
          type: integer
        pinnedBy:
          type: string
          description: Plain-language reason for the estate level
        distribution:
          type: object
          properties:
            level1:
              type: integer
            level2:
              type: integer
            level3:
              type: integer
            level4:
              type: integer
            level5:
              type: integer
        kpis:
          type: object
          properties:
            ownerCoveragePercent:
              type: number
            renewalHeadroomPercent:
              type: number
            automationCoveragePercent:
              type: number
            medianTimeToRotateHours:
              type:
              - number
              - 'null'
        groupBy:
          type: string
          enum:
          - owner_team
          - business_unit
          - bucket
        groups:
          type: array
          items:
            type: object
            required:
            - name
            - certificates
            - level
            properties:
              name:
                type:
                - string
                - 'null'
              certificates:
                type: integer
              critical:
                type: integer
              headroomPercent:
                type: number
              automatedPercent:
                type: number
              level:
                type: integer
        computedAt:
          type: string
          format: date-time
    CertificatesImportPhase:
      type: string
      enum:
      - AwaitingUpload
      - Pending
      - Previewing
      - AwaitingConfirmation
      - Applying
      - Completed
      - Failed
      - Cancelled
      - Expired
    CertificatesImportCounters:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        conflict:
          type: integer
        stale:
          type: integer
        error:
          type: integer
    CertificatesCreateImportRequest:
      type: object
      required:
      - filename
      - sizeBytes
      - contentSha256
      - contentType
      properties:
        filename:
          type: string
          maxLength: 256
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 12582912
        contentSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        contentType:
          type: string
          enum:
          - text/csv
          - application/octet-stream
        namespace:
          type: string
          default: certificates
        formatHint:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
          maxLength: 256
        sample:
          type:
          - string
          - 'null'
          maxLength: 12288
          description: Base64 of the first 8 KiB (≤ 12,288 chars), lets the API reject an unknown format immediately
        mode:
          type: string
          enum:
          - previewThenApply
          - applyDirect
          default: previewThenApply
    CertificatesSignedUpload:
      type: object
      required:
      - url
      - method
      - headers
      - expiresAt
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Send exactly these headers with the PUT (content type, length, one-time precondition)
        expiresAt:
          type: string
          format: date-time
    CertificatesImportAccepted:
      type: object
      required:
      - importId
      - phase
      - statusUrl
      properties:
        importId:
          type: string
        phase:
          $ref: '#/components/schemas/CertificatesImportPhase'
        upload:
          oneOf:
          - $ref: '#/components/schemas/CertificatesSignedUpload'
          - type: 'null'
        statusUrl:
          type: string
        previewUrl:
          type: string
        eventsUrl:
          type: string
    CertificatesImportStatus:
      type: object
      required:
      - importId
      - phase
      - requestedBy
      - createdAt
      properties:
        importId:
          type: string
        namespace:
          type: string
        phase:
          $ref: '#/components/schemas/CertificatesImportPhase'
        filename:
          type: string
        sizeBytes:
          type: integer
        contentSha256:
          type: string
        requestedBy:
          type: object
          properties:
            subject:
              type: string
            displayName:
              type: string
        note:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        preview:
          type:
          - object
          - 'null'
          properties:
            summary:
              $ref: '#/components/schemas/CertificatesImportCounters'
            sha256:
              type: string
            expiresAt:
              type: string
              format: date-time
            detectedFormat:
              type: string
            columnMapping:
              type: array
              items:
                $ref: '#/components/schemas/CertificatesColumnMapping'
            warnings:
              type: array
              items:
                type: string
        result:
          type:
          - object
          - 'null'
          properties:
            summary:
              $ref: '#/components/schemas/CertificatesImportCounters'
            completedAt:
              type: string
              format: date-time
            durationSeconds:
              type: number
            errors:
              type: array
              items:
                type: object
                properties:
                  line:
                    type: integer
                  host:
                    type: string
                  reason:
                    type: string
        confirmation:
          type:
          - object
          - 'null'
          properties:
            confirmedBy:
              type: string
            confirmedAt:
              type: string
              format: date-time
        artifacts:
          type: object
          properties:
            scan:
              type:
              - object
              - 'null'
              properties:
                sizeBytes:
                  type: integer
                sha256:
                  type: string
            preview:
              type:
              - object
              - 'null'
              properties:
                sizeBytes:
                  type: integer
                sha256:
                  type: string
            result:
              type:
              - object
              - 'null'
              properties:
                sizeBytes:
                  type: integer
                sha256:
                  type: string
        lastError:
          type:
          - string
          - 'null'
    CertificatesImportList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CertificatesImportStatus'
        page:
          $ref: '#/components/schemas/PageInfo'
    CertificatesDiffRow:
      type: object
      required:
      - outcome
      - host
      properties:
        outcome:
          type: string
          enum:
          - created
          - updated
          - unchanged
          - conflict
          - stale
          - error
        host:
          type: string
        before:
          type:
          - string
          - 'null'
        after:
          type:
          - string
          - 'null'
        line:
          type:
          - integer
          - 'null'
        reason:
          type:
          - string
          - 'null'
    CertificatesDiffPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CertificatesDiffRow'
        page:
          $ref: '#/components/schemas/PageInfo'
    CertificatesConfirmRequest:
      type: object
      required:
      - previewSha256
      properties:
        previewSha256:
          type: string
    CertificatesAcknowledgeRequest:
      type: object
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 512
  parameters:
    namespace:
      name: namespace
      in: query
      required: false
      description: Restrict to one namespace; absent = all namespaces the caller may read
      schema:
        type: string
    state:
      name: state
      in: query
      required: false
      description: Filter by reconciliation state
      schema:
        type: string
        enum:
        - Pending
        - Created
        - Updated
        - Failed
        description: Reconciliation state written by the controller
    search:
      name: search
      in: query
      required: false
      description: Case-insensitive match on name and the kind's primary field
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor from a previous page
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Field name, prefix with - for descending
      schema:
        type: string
        default: name
    pathNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    pathName:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token (Microsoft Entra ID or Sesame-IDAM); validated against the configured JWKS
