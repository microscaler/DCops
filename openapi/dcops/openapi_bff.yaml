      operationId: get_platform_summary
      tags:
      - Dashboard
      summary: 'Dashboard totals: resources, healthy, pending, failed, by category'
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - healthy
                - pending
                - failed
                - kinds
                - categories
                - refreshedAt
                properties:
                  total:
                    type: integer
                  healthy:
                    type: integer
                  pending:
                    type: integer
                  failed:
                    type: integer
                  kinds:
                    type: integer
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformCategoryCount'
                  refreshedAt:
                    type: string
                    format: date-time
              example:
                total: 7437
                healthy: 7391
                pending: 31
                failed: 15
                kinds: 30
                refreshedAt: '2026-09-08T08:41:12Z'
                categories:
                - category: ipam
                  service: ipam
                  kinds: 9
                  count: 412
                  byState:
                    Created: 400
                    Pending: 9
                    Failed: 3
                - category: dcim
                  service: dcim
                  kinds: 11
                  count: 1208
                  byState:
                    Created: 1200
                    Failed: 8
                - category: certificates
                  service: certificates
                  kinds: 3
                  count: 5368
                  byState:
                    Created: 5364
                    Failed: 4
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
