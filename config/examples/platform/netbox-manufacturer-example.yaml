apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxManufacturer
metadata:
  name: raspberry-pi
  namespace: default
spec:
  name: "Raspberry Pi"
  slug: "raspberry-pi"
  description: "Raspberry Pi Foundation single-board computer"
  comments: "DRIFT TEST 2: Updated manufacturer comments - 2026-01-04-175200"
  driftDetection: true
  # Tag references (optional)
  # Tags must exist in NetBox before they can be referenced
  # See netbox-tag-example.yaml for creating tags
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: managed-by-dcops
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: production
      namespace: default

