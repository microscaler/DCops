apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxTenant
metadata:
  name: datacenter-tenant
  namespace: default
spec:
  name: Data Center Operations
  slug: datacenter-ops
  description: Primary tenant for datacenter operations
  comments: Managed by DCops
  driftDetection: true
  group:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenantGroup
    name: default
    namespace: default
  tokenSecret:
    name: netbox-token-datacenter-tenant
  reconcileInterval: 300
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: managed-by-dcops
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: production
    namespace: default
