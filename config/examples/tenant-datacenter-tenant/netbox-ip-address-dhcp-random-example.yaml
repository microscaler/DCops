apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPAddress
metadata:
  name: dhcp-client-ip-random
  namespace: default
spec:
  # Random DHCP allocation: IP will be allocated from the range
  # Do NOT specify address here - it will be stored in status.address after reconciliation
  # 
  # NOTE: Currently, NetBox does not support allocating IPs directly from IP ranges.
  # For random allocation, you should use a NetBoxPrefix and reference it via ipRange.
  # Future enhancement: Support direct IP range allocation.
  
  # IP range reference (required for random allocation)
  # This defines the DHCP pool from which an IP will be allocated
  ipRange:
    apiGroup: dcops.microscaler.io
    kind: NetBoxIPRange
    name: dhcp-pool-range
    namespace: default
  
  # Tenant reference (required)
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  
  # VLAN reference (optional)
  vlan:
    apiGroup: dcops.microscaler.io
    kind: NetBoxVLAN
    name: client-vlan
    namespace: default
  
  # IP address status: dhcp (for DHCP-assigned addresses)
  # This indicates the IP was assigned via DHCP, not statically configured
  # Options: active, reserved, deprecated, dhcp, slaac
  status: dhcp
  
  # IP address role (optional)
  # Options: loopback, secondary, anycast, vip, vrrp, hsrp, glbp, carp
  # DHCP addresses typically don't have a role
  
  # DNS name (optional)
  dnsName: "dhcp-client-random.example.com"
  
  # Description (optional)
  description: "Random DHCP allocation - IP will be assigned from pool"
  
  # Tag references (optional)
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: dhcp-managed
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: client-device
      namespace: default
  
  # Comments (optional)
  comments: "IP will be randomly allocated from the DHCP pool range. The allocated IP will be stored in status.address after reconciliation."

# NOTE: After reconciliation, status.address will contain the allocated IP
# Example status after reconciliation:
# status:
#   address: "192.168.1.150/24"  # Allocated from the range
#   netboxId: 42
#   netboxUrl: "http://netbox/api/ipam/ip-addresses/42/"
#   state: Created
#
# For static DHCP reservations (specific IP for specific MAC), see:
# netbox-ip-address-dhcp-example.yaml

