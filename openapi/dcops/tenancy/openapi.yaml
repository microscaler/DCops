components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
      properties:
        type:
          type: string
        status:
          type: string
          enum:
          - 'True'
          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: Total matching items
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page
    KindCount:
      type: object
      required:
      - kind
      - plural
      - segment
      - count
      properties:
        kind:
          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    TenantSpec:
      description: NetBoxTenantSpec defines the desired state of a NetBox tenant
      properties:
        comments:
          description: Comments
          type:
          - string
          - 'null'
        description:
          description: Description of the tenant
          type:
          - string
          - 'null'
        driftDetection:
          default: true
          description: |-
            Enable drift detection (default: true)

            When enabled, the reconciler will detect and correct any changes made to the resource
            in the NetBox UI that differ from the CRD spec. Git is the source of truth.
            Set to false to disable drift detection (not recommended for GitOps workflows).
          type:
          - boolean
          - 'null'
        group:
          description: Tenant group reference (references NetBoxTenantGroup CRD, optional)
          properties:
            apiGroup:
              description: API group of the referenced resource (e.g., "dcops.microscaler.io")
              type: string
            kind:
              description: Kind of the referenced resource (e.g., "NetBoxSite", "NetBoxTenant")
              type: string
            name:
              description: Name of the referenced NetBox CRD resource
              type: string
            namespace:
              description: Namespace of the referenced resource (defaults to same namespace as the referencing resource)
              type:
              - string
              - 'null'
          required:
          - apiGroup
          - kind
          - name
          type:
          - object
          - 'null'
        name:
          description: Tenant name
          type: string
        reconcileInterval:
          description: |-
            Reconcile interval in seconds

            How often to check for drift between the CRD spec and NetBox, even when no changes occur.
            Defaults to 300 seconds (5 minutes) if not specified.
            Set to 0 to disable periodic reconciliation (only reconcile on changes).
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        slug:
          description: Tenant slug (optional, auto-generated from name if not provided)
          type:
          - string
          - 'null'
        tags:
          description: Tag references (references NetBoxTag CRDs)
          items:
            description: |-
              Kubernetes-compliant resource reference for NetBox CRDs

              This follows the Kubernetes `TypedLocalObjectReference` pattern, which includes:
              - `apiGroup`: The API group of the referenced resource (e.g., "dcops.microscaler.io")
              - `kind`: The kind of the referenced resource (e.g., "NetBoxSite")
              - `name`: The name of the referenced resource (required)
              - `namespace`: The namespace of the referenced resource (optional, defaults to same namespace)

              This enables Kubernetes to validate reference types and provides clear documentation
              of what resource type is expected.
            properties:
              apiGroup:
                description: API group of the referenced resource (e.g., "dcops.microscaler.io")
                type: string
              kind:
                description: Kind of the referenced resource (e.g., "NetBoxSite", "NetBoxTenant")
                type: string
              name:
                description: Name of the referenced NetBox CRD resource
                type: string
              namespace:
                description: Namespace of the referenced resource (defaults to same namespace as the referencing resource)
                type:
                - string
                - 'null'
            required:
            - apiGroup
            - kind
            - name
            type: object
          type:
          - array
          - 'null'
        tokenSecret:
          description: |-
            Secret reference containing the NetBox API token for this tenant

            The Secret must contain a key (defaults to "token") with the NetBox API token.
            If namespace is not specified, the Secret is expected to be in the same namespace
            as the Tenant CRD.
          properties:
            key:
              description: Key within the Secret data (optional, defaults to "token")
              type:
              - string
              - 'null'
            name:
              description: Name of the Kubernetes Secret
              type: string
            namespace:
              description: Namespace of the Secret (optional, defaults to the namespace of the referencing resource)
              type:
              - string
              - 'null'
          required:
          - name
          type: object
      required:
      - name
      - tokenSecret
      type: object
    TenantStatus:
      description: NetBoxTenantStatus defines the observed state of a NetBox tenant
      properties:
        error:
          description: Error message if reconciliation failed
          type:
          - string
          - 'null'
        lastReconciled:
          description: Last reconciliation timestamp
          format: date-time
          type:
          - string
          - 'null'
        netboxId:
          description: NetBox tenant ID (set after creation)
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        netboxUrl:
          description: NetBox tenant URL
          type:
          - string
          - 'null'
        state:
          description: Current state of the tenant
          enum:
          - Pending
          - Created
          - Updated
          - Failed
          type: string
      required:
      - state
      type:
      - object
      - 'null'
    TenantRow:
      type: object
      required:
      - metadata
      - state
      - spec
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        netboxUrl:
          type:
          - string
          - 'null'
        spec:
          type: object
          description: Scalar spec fields for table columns
          properties:
            comments:
              description: Comments
              type:
              - string
              - 'null'
            description:
              description: Description of the tenant
              type:
              - string
              - 'null'
            driftDetection:
              default: true
              description: |-
                Enable drift detection (default: true)

                When enabled, the reconciler will detect and correct any changes made to the resource
                in the NetBox UI that differ from the CRD spec. Git is the source of truth.
                Set to false to disable drift detection (not recommended for GitOps workflows).
              type:
              - boolean
              - 'null'
            group:
              type:
              - string
              - 'null'
              description: Tenant group reference (references NetBoxTenantGroup CRD, optional) (name of the referenced resource)
            name:
              description: Tenant name
              type: string
            reconcileInterval:
              description: |-
                Reconcile interval in seconds

                How often to check for drift between the CRD spec and NetBox, even when no changes occur.
                Defaults to 300 seconds (5 minutes) if not specified.
                Set to 0 to disable periodic reconciliation (only reconcile on changes).
              format: int64
              minimum: 0
              type:
              - integer
              - 'null'
            slug:
              description: Tenant slug (optional, auto-generated from name if not provided)
              type:
              - string
              - 'null'
            tokenSecret:
              type:
              - string
              - 'null'
              description: Secret reference containing the NetBox API token for this tenant (name of the referenced resource)
    TenantDetail:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: dcops.microscaler.io/v1alpha1
        kind:
          type: string
          const: NetBoxTenant
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/TenantSpec'
        status:
          oneOf:
          - $ref: '#/components/schemas/TenantStatus'
          - type: 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        manifestYaml:
          type: string
          description: The declared resource as YAML (spec only), for the Manifest panel
        gitUrl:
          type:
          - string
          - 'null'
          description: Link to the declaring file in the GitOps repository when known
    TenantList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantRow'
        page:
          $ref: '#/components/schemas/PageInfo'
    TenantGroupSpec:
      description: NetBoxTenantGroupSpec defines the desired state of a NetBox tenant group
      properties:
        comments:
          description: Comments
          type:
          - string
          - 'null'
        description:
          description: Description of the tenant group
          type:
          - string
          - 'null'
        driftDetection:
          default: true
          description: |-
            Enable drift detection (default: true)

            When enabled, the reconciler will detect and correct any changes made to the resource
            in the NetBox UI that differ from the CRD spec. Git is the source of truth.
            Set to false to disable drift detection (not recommended for GitOps workflows).
          type:
          - boolean
          - 'null'
        name:
          description: Tenant group name
          type: string
        parent:
          description: Parent tenant group reference (references NetBoxTenantGroup CRD for hierarchical organization)
          properties:
            apiGroup:
              description: API group of the referenced resource (e.g., "dcops.microscaler.io")
              type: string
            kind:
              description: Kind of the referenced resource (e.g., "NetBoxSite", "NetBoxTenant")
              type: string
            name:
              description: Name of the referenced NetBox CRD resource
              type: string
            namespace:
              description: Namespace of the referenced resource (defaults to same namespace as the referencing resource)
              type:
              - string
              - 'null'
