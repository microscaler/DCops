      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: BootProfile rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootProfileList'
              example:
                items:
                - metadata:
                    name: boot-profile-1
                    namespace: default
                    uid: 2a1f0c7e-1
                    creationTimestamp: '2026-09-01T10:00:00Z'
                  state: Created
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  netboxId: 42
                  netboxUrl: http://netbox.netbox/api/bootprofiles/42/
                  spec:
                    cmdline: ''
                    kernel: example
                    message: example
                    schematicId: example
                page:
                  total: 1
                  nextCursor: null
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
