apiVersion: v1
kind: Secret
metadata:
  name: netbox-db-credentials
  namespace: netbox
  labels:
    app: netbox
    managed-by: dcops
type: Opaque
# Dev default — mirrors the hauliage-db-credentials pattern (per-app secret in the
# app's own namespace). This password MUST match the `netbox` role created on the
# shared Postgres (see the provisioning note in the NetBox deploy docs / justfile).
stringData:
  # Non-dictionary value on purpose: the controller redacts this secret's value
  # from its logs, so a literal like "netbox" would scrub every "netbox" mention.
  DB_PASSWORD: dcops_dev_password_change_in_prod
