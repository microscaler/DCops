openapi: 3.1.0
info:
  title: DCops — IP pools and claims
  version: 0.1.0
  description: |-
    IP pools and claims. Paths are service-relative; the BFF adds /api/v1/ippools (bff-suite-config.yaml).
    Generated by openapi/dcops/scripts/build_specs.py from config/crd/all-crds.yaml and the screen contracts in
    docs/03_ui_design — do not edit by hand. Version policy: stay on 3.1.0.
tags:
- name: IPPool
  description: IPPool (ippools.dcops.microscaler.io/v1alpha1)
- name: IPClaim
  description: IPClaim (ipclaims.dcops.microscaler.io/v1alpha1)
paths:
  /pools:
    get:
      operationId: list_pools
      tags:
      - IPPool
      summary: List IPPool resources as table rows
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - name: vrf
        in: query
        required: false
        schema:
          type: string
        description: Filter by vrf
      responses:
        '200':
          description: IPPool rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPPoolList'
              example:
                items:
                - metadata:
                    name: pool-1
                    namespace: default
                    uid: 2a1f0c7e-1
                    creationTimestamp: '2026-09-01T10:00:00Z'
                  state: Created
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  netboxId: 42
                  netboxUrl: http://netbox.netbox/api/ippools/42/
                  spec:
                    prefix: 10.10.0.0/24
                    vrf: example
                    gateway: example
                    description: Example description
                page:
                  total: 1
                  nextCursor: null
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /pools/{namespace}/{name}:
    get:
      operationId: get_pool
      tags:
      - IPPool
      summary: Get one IPPool with status, conditions and manifest
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/pathNamespace'
      - $ref: '#/components/parameters/pathName'
      responses:
        '200':
          description: IPPool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPPoolDetail'
              example:
                apiVersion: dcops.microscaler.io/v1alpha1
                kind: IPPool
                metadata:
                  name: pool-1
                  namespace: default
                  uid: 2a1f0c7e-1
                  creationTimestamp: '2026-09-01T10:00:00Z'
                spec:
                  prefix: 10.10.0.0/24
                  vrf: example
                  gateway: example
                  reserved:
                  - example
                  description: Example description
                status:
                  allocated: 1
                  capacity: 1
                  state: Pending
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                conditions:
                - type: Ready
                  status: 'True'
                  reason: Reconciled
                  message: present in NetBox
                  lastTransitionTime: '2026-09-08T08:41:12Z'
                manifestYaml: |
                  apiVersion: dcops.microscaler.io/v1alpha1
                  kind: IPPool
                  metadata:
                    name: pool-1
                    namespace: default
                  spec:
                    prefix: 10.10.0.0/24
                    vrf: example
                    gateway: example
                    reserved:
                    - example
                    description: Example description
                gitUrl: null
        '404':
          description: No such resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: not_found
                message: No such resource
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /claims:
    get:
      operationId: list_claims
      tags:
      - IPClaim
      summary: List IPClaim resources as table rows
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - name: pool
        in: query
        required: false
        schema:
          type: string
        description: Filter by pool
      responses:
        '200':
          description: IPClaim rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPClaimList'
              example:
                items:
                - metadata:
                    name: claim-1
                    namespace: default
                    uid: 2a1f0c7e-1
                    creationTimestamp: '2026-09-01T10:00:00Z'
                  state: Created
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  netboxId: 42
                  netboxUrl: http://netbox.netbox/api/ipclaims/42/
                  spec:
                    pool: example
                    requestedBy: example
                    macAddress: dc:a6:32:1f:04:9a
                    hostname: example
                page:
                  total: 1
                  nextCursor: null
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /claims/{namespace}/{name}:
    get:
      operationId: get_claim
      tags:
      - IPClaim
      summary: Get one IPClaim with status, conditions and manifest
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/pathNamespace'
      - $ref: '#/components/parameters/pathName'
      responses:
        '200':
          description: IPClaim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPClaimDetail'
              example:
                apiVersion: dcops.microscaler.io/v1alpha1
                kind: IPClaim
                metadata:
                  name: claim-1
                  namespace: default
                  uid: 2a1f0c7e-1
                  creationTimestamp: '2026-09-01T10:00:00Z'
                spec:
                  pool: example
                  requestedBy: example
                  macAddress: dc:a6:32:1f:04:9a
                  hostname: example
                status:
                  address: 10.10.0.11
                  netboxId: 42
                  state: Pending
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                conditions:
                - type: Ready
                  status: 'True'
                  reason: Reconciled
                  message: present in NetBox
                  lastTransitionTime: '2026-09-08T08:41:12Z'
                manifestYaml: |
                  apiVersion: dcops.microscaler.io/v1alpha1
                  kind: IPClaim
                  metadata:
                    name: claim-1
                    namespace: default
                  spec:
                    pool: example
                    requestedBy: example
                    macAddress: dc:a6:32:1f:04:9a
                    hostname: example
                gitUrl: null
        '404':
          description: No such resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: not_found
                message: No such resource
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /summary:
    get:
      operationId: get_ippools_summary
      tags:
      - Summary
      summary: Counts per kind and state for the ippools section landing page
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Per-kind counts
          content:
            application/json:
              schema:
                type: object
                required:
                - kinds
                - total
                properties:
                  total:
                    type: integer
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/KindCount'
              example:
                total: 2
                kinds:
                - kind: IPPool
                  plural: ippools
                  segment: pools
                  count: 1
                  byState:
                    Created: 1
                - kind: IPClaim
                  plural: ipclaims
                  segment: claims
                  count: 1
                  byState:
                    Created: 1
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
      properties:
        type:
          type: string
        status:
          type: string
          enum:
          - 'True'
          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: Total matching items
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page
    KindCount:
      type: object
      required:
      - kind
      - plural
      - segment
      - count
      properties:
        kind:
          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    IPPoolSpec:
      type: object
      required:
      - prefix
      properties:
        prefix:
          type: string
          description: CIDR the pool allocates from
        vrf:
          type:
          - string
          - 'null'
          description: NetBoxVRF name
        gateway:
          type:
          - string
          - 'null'
        reserved:
          type: array
          items:
            type: string
          description: Addresses never allocated
        description:
          type:
          - string
          - 'null'
    IPPoolStatus:
      type: object
      properties:
        allocated:
          type: integer
        capacity:
          type: integer
        state:
          type: string
          enum:
          - Pending
          - Created
          - Updated
          - Failed
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
    IPPoolRow:
      type: object
      required:
      - metadata
      - state
      - spec
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        netboxUrl:
          type:
          - string
          - 'null'
        spec:
          type: object
          description: Scalar spec fields for table columns
          properties:
            prefix:
              type: string
              description: CIDR the pool allocates from
            vrf:
              type:
              - string
              - 'null'
              description: NetBoxVRF name
            gateway:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
        status:
          type: object
          properties:
            allocated:
              type: integer
            capacity:
              type: integer
        utilisationPercent:
          type: number
          description: allocated / capacity × 100, computed server-side
    IPPoolDetail:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: dcops.microscaler.io/v1alpha1
        kind:
          type: string
          const: IPPool
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/IPPoolSpec'
        status:
          oneOf:
          - $ref: '#/components/schemas/IPPoolStatus'
          - type: 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        manifestYaml:
          type: string
          description: The declared resource as YAML (spec only), for the Manifest panel
        gitUrl:
          type:
          - string
          - 'null'
          description: Link to the declaring file in the GitOps repository when known
    IPPoolList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IPPoolRow'
        page:
          $ref: '#/components/schemas/PageInfo'
    IPClaimSpec:
      type: object
      required:
      - pool
      properties:
        pool:
          type: string
          description: IPPool name
        requestedBy:
          type:
          - string
          - 'null'
          description: Kind/name of the requester, e.g. NetBoxDevice/cp-01
        macAddress:
          type:
          - string
          - 'null'
        hostname:
          type:
          - string
          - 'null'
    IPClaimStatus:
      type: object
      properties:
        address:
          type:
          - string
          - 'null'
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        state:
          type: string
          enum:
          - Pending
          - Created
          - Updated
          - Failed
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
    IPClaimRow:
      type: object
      required:
      - metadata
      - state
      - spec
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        netboxUrl:
          type:
          - string
          - 'null'
        spec:
          type: object
          description: Scalar spec fields for table columns
          properties:
            pool:
              type: string
              description: IPPool name
            requestedBy:
              type:
              - string
              - 'null'
              description: Kind/name of the requester, e.g. NetBoxDevice/cp-01
            macAddress:
              type:
              - string
              - 'null'
            hostname:
              type:
              - string
              - 'null'
        status:
          type: object
          properties:
            address:
              type:
              - string
              - 'null'
    IPClaimDetail:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: dcops.microscaler.io/v1alpha1
        kind:
          type: string
          const: IPClaim
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/IPClaimSpec'
        status:
          oneOf:
          - $ref: '#/components/schemas/IPClaimStatus'
          - type: 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        manifestYaml:
          type: string
          description: The declared resource as YAML (spec only), for the Manifest panel
        gitUrl:
          type:
          - string
          - 'null'
          description: Link to the declaring file in the GitOps repository when known
    IPClaimList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IPClaimRow'
        page:
          $ref: '#/components/schemas/PageInfo'
  parameters:
    namespace:
      name: namespace
      in: query
      required: false
      description: Restrict to one namespace; absent = all namespaces the caller may read
      schema:
        type: string
    state:
      name: state
      in: query
      required: false
      description: Filter by reconciliation state
      schema:
        type: string
        enum:
        - Pending
        - Created
        - Updated
        - Failed
        description: Reconciliation state written by the controller
    search:
      name: search
      in: query
      required: false
      description: Case-insensitive match on name and the kind's primary field
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor from a previous page
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Field name, prefix with - for descending
      schema:
        type: string
        default: name
    pathNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    pathName:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token (Microsoft Entra ID or Sesame-IDAM); validated against the configured JWKS
