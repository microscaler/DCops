apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxTenantGroup
metadata:
  name: default
  namespace: default
spec:
  name: "Default"
  slug: "default"
  description: "Default tenant group for DCops"
  comments: "Default tenant group managed by DCops controller. All tenants without a specific group will use this group."
  driftDetection: true
  # Tag references (optional)
  # Tags must exist in NetBox before they can be referenced
  # See netbox-tag-example.yaml for creating tags
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: managed-by-dcops
      namespace: default

