suite: dcops
bff_service_name: dcopsBFF
package_prefix: dcops
architecture: multi-suite
openapi_base_dir: openapi/dcops
output_path: openapi/dcops/openapi_bff.yaml
services:
  platform:
    base_path: /api/v1/platform
    gateway_path_style: prefixed
    spec_path: platform/openapi.yaml
  dcim:
    base_path: /api/v1/dcim
    gateway_path_style: prefixed
    spec_path: dcim/openapi.yaml
  ipam:
    base_path: /api/v1/ipam
    gateway_path_style: prefixed
    spec_path: ipam/openapi.yaml
  tenancy:
    base_path: /api/v1/tenancy
    gateway_path_style: prefixed
    spec_path: tenancy/openapi.yaml
  extras:
    base_path: /api/v1/extras
    gateway_path_style: prefixed
    spec_path: extras/openapi.yaml
  boot:
    base_path: /api/v1/boot
    gateway_path_style: prefixed
    spec_path: boot/openapi.yaml
  ippools:
    base_path: /api/v1/ippools
    gateway_path_style: prefixed
    spec_path: ippools/openapi.yaml
  certificates:
    base_path: /api/v1/certificates
    gateway_path_style: prefixed
    spec_path: certificates/openapi.yaml
metadata:
  title: DCops API Gateway
  version: 0.1.0
  description: Backend for Frontend (BFF) for the DCops web UI. The browser talks only to this gateway with an OIDC bearer
    token; the gateway proxies to per-domain BRRTRouter services which read CRDs and call the certificate controller. This
    spec is automatically generated by openapi/dcops/scripts/build_specs.py — do not edit manually.
  servers:
  - url: /api/v1
    description: DCops gateway (BFF route prefix)
  bff_impl_operations: []
