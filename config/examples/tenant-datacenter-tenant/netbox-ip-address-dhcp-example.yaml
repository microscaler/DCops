apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPAddress
metadata:
  name: dhcp-client-ip
  namespace: default
spec:
  # IP range reference (required for DHCP-assigned IPs)
  # Reference the NetBoxIPRange CRD that defines the DHCP pool from which the IP was assigned.
  # This links the IP address to its DHCP pool for proper tracking and management.
  # 
  # NOTE: For DHCP addresses, do NOT specify the address in spec.address.
  # The IP address assigned by DHCP will be stored in status.address after reconciliation.
  # The reconciler will track the DHCP-assigned IP and store it in the status section.
  ipRange:
    apiGroup: dcops.microscaler.io
    kind: NetBoxIPRange
    name: dhcp-pool-range
    namespace: default
  
  # IP address with CIDR (NOT used for DHCP-assigned IPs)
  # For DHCP IPs, the address is stored in status.address after reconciliation, not in spec.
  # Only specify address here for statically-assigned IPs.
  # address: "192.168.1.100/24"
  
  # Tenant reference (required)
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  
  # VLAN reference (optional)
  vlan:
    apiGroup: dcops.microscaler.io
    kind: NetBoxVLAN
    name: client-vlan
    namespace: default
  
  # IP address status: dhcp (for DHCP-assigned addresses)
  # This indicates the IP was assigned via DHCP, not statically configured
  # Options: active, reserved, deprecated, dhcp, slaac
  # 
  # NOTE: For proper DHCP management, use NetBoxIPRange CRD to define the DHCP
  # IP range pool. Individual DHCP-assigned IPs are tracked via NetBoxIPAddress
  # CRs created after DHCP assignment.
  status: dhcp
  
  # IP address role (optional)
  # Options: loopback, secondary, anycast, vip, vrrp, hsrp, glbp, carp
  # DHCP addresses typically don't have a role
  
  # DNS name (optional)
  dnsName: "dhcp-client.example.com"
  
  # Description (optional)
  description: "DHCP-assigned IP address - tracking IP assigned by DHCP server"
  
  # Tag references (optional)
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: dhcp-managed
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: client-device
      namespace: default
  
  # Comments (optional)
  comments: "IP was dynamically assigned via DHCP. This CR tracks the assigned IP in NetBox for inventory purposes."

  # NOTE: For proper DHCP IP management, create a NetBoxIPRange CR first
  # that defines the DHCP pool (e.g., 192.168.1.100-200/24).
  # DHCP IP addresses should reference the IP range for proper tracking.
  # See netbox-ip-range-example.yaml for an example IP range CR.

