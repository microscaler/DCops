apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPRange
metadata:
  name: dhcp-pool-range
  namespace: default
spec:
  startAddress: 192.168.1.100/24
  endAddress: 192.168.1.200/24
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  status: active
  description: DHCP pool range for client devices
  comments: This IP range is used for DHCP pool allocation. Managed by DCops controller.
  driftDetection: true
  markUtilized: false
  markPopulated: true
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: managed-by-dcops
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: dhcp-managed
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: client-device
    namespace: default
