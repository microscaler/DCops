apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxDeviceRole
metadata:
  name: kubernetes-control-plane
  namespace: default
spec:
  name: "Kubernetes Control Plane"
  slug: "kubernetes-control-plane"
  color: "2196f3"  # Blue color for control plane
  vmRole: false  # Physical device role
  description: "Kubernetes control plane nodes"
  comments: "Managed by DCops"
  # Tag references (optional)
  # Tags must exist in NetBox before they can be referenced
  # See netbox-tag-example.yaml for creating tags
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: managed-by-dcops
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: production
      namespace: default

