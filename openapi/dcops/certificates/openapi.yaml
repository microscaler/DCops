          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
