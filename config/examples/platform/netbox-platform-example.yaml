apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxPlatform
metadata:
  name: talos-linux
  namespace: default
spec:
  name: "Talos Linux"
  slug: "talos-linux"
  manufacturer:
    apiGroup: "dcops.microscaler.io"
    kind: "NetBoxManufacturer"
    name: "raspberry-pi"
  description: "Talos Linux for Kubernetes on Raspberry Pi"
  comments: "Managed by DCops for Pi cluster deployments"
  # Tag references (optional)
  # Tags must exist in NetBox before they can be referenced
  # See netbox-tag-example.yaml for creating tags
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: managed-by-dcops
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: production
      namespace: default

