apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dcops-dashboard-reader
rules:
  - apiGroups: ["dcops.microscaler.io"]
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dcops-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: dcops-system
roleRef:
  kind: ClusterRole
  name: dcops-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
