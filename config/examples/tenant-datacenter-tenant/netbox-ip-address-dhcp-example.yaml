apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxIPAddress
metadata:
  name: dhcp-client-ip-static
  namespace: default
spec:
  address: 192.168.1.101/24
  macAddress: aa:bb:cc:dd:ee:ff
  ipRange:
    apiGroup: dcops.microscaler.io
    kind: NetBoxIPRange
    name: dhcp-pool-range
    namespace: default
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default
  vlan:
    apiGroup: dcops.microscaler.io
    kind: NetBoxVLAN
    name: client-vlan
    namespace: default
  status: dhcp
  dnsName: dhcp-client.example.com
  description: Static DHCP reservation for client device - IP always assigned to this
    MAC
  tags:
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: dhcp-managed
    namespace: default
  - apiGroup: dcops.microscaler.io
    kind: NetBoxTag
    name: client-device
    namespace: default
  comments: IP is statically reserved in DHCP server for this MAC address. This CR
    tracks the reservation in NetBox.
  driftDetection: true
