          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    ColumnMapping:
      type: object
      required:
      - column
      - meaning
      properties:
        column:
