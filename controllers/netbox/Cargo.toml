[package]
name = "netbox-controller"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Unified NetBox Controller for managing NetBoxPrefix, IPPool, and IPClaim CRDs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
kube = { workspace = true }
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_30"] }  # Binary crate: enable version feature (0.26 supports up to v1_30)
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"

# Local crates
crds = { path = "../../crates/crds" }
netbox-client = { path = "../../crates/netbox-client", features = ["test-util"] }

# IP network types
ipnet = { workspace = true }

# Async trait support
async-trait = "0.1"

[dev-dependencies]
# Testing dependencies
tower-test = "0.4"
tower = { workspace = true }  # Needed for tower::Service trait in mocks
# Note: tower-test 0.4 uses hyper 0.14, which has hyper::Body
# We need to use hyper 0.14 for compatibility
hyper = { version = "1.8", features = ["full"] }
bytes = "1.0"

