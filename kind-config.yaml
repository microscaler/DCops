# DCops uses the shared Kind cluster (context kind-kind).
#
# Symlink this file to the shared config (same layout as cylon / hauliage):
#   ln -sf ../shared-kind-cluster/kind-config.yaml kind-config.yaml
#
# DCops does not create its own cluster. Prerequisites:
#   cd ../shared-kind-cluster && just cluster-create
#
# Host port forwards for DCops services are assigned in the DCops Tiltfile
# (NetBox 8011, Kea 8010) to avoid conflicts with shared-kind host mappings.
