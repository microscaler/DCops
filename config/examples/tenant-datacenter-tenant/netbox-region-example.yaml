apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxRegion
metadata:
  name: us-east
  namespace: default
spec:
  name: "US East"
  slug: "us-east"
  description: "US East region for datacenter operations"
  # Optional: parent region for hierarchical organization
  # parent:
  #   apiGroup: "dcops.microscaler.io"
  #   kind: "NetBoxRegion"
  #   name: "north-america"
  # Tag references (optional)
  # Tags must exist in NetBox before they can be referenced
  # See netbox-tag-example.yaml for creating tags
  tags:
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: managed-by-dcops
      namespace: default
    - apiGroup: dcops.microscaler.io
      kind: NetBoxTag
      name: production
      namespace: default

