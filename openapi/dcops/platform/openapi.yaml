openapi: 3.1.0
info:
  title: DCops — Platform (dashboard, discovery, events, identity)
  version: 0.1.0
  description: |-
    Platform (dashboard, discovery, events, identity). Paths are service-relative; the BFF adds /api/v1/platform (bff-suite-config.yaml).
    Generated by openapi/dcops/scripts/build_specs.py from config/crd/all-crds.yaml and the screen contracts in
    docs/03_ui_design — do not edit by hand. Version policy: stay on 3.1.0.
tags:
- name: Dashboard
- name: Discovery
- name: Events
- name: Identity
- name: Health
paths:
  /summary:
    get:
      operationId: get_platform_summary
      tags:
      - Dashboard
      summary: 'Dashboard totals: resources, healthy, pending, failed, by category'
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - healthy
                - pending
                - failed
                - kinds
                - categories
                - refreshedAt
                properties:
                  total:
                    type: integer
                  healthy:
                    type: integer
                  pending:
                    type: integer
                  failed:
                    type: integer
                  kinds:
                    type: integer
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryCount'
                  refreshedAt:
                    type: string
                    format: date-time
              example:
                total: 7437
                healthy: 7391
                pending: 31
                failed: 15
                kinds: 30
                refreshedAt: '2026-09-08T08:41:12Z'
                categories:
                - category: ipam
                  service: ipam
                  kinds: 9
                  count: 412
                  byState:
                    Created: 400
                    Pending: 9
                    Failed: 3
                - category: dcim
                  service: dcim
                  kinds: 11
                  count: 1208
                  byState:
                    Created: 1200
                    Failed: 8
                - category: certificates
                  service: certificates
                  kinds: 3
                  count: 5368
                  byState:
                    Created: 5364
                    Failed: 4
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /attention:
    get:
      operationId: list_attention
      tags:
      - Dashboard
      summary: Resources in Failed or Pending state across every kind (dashboard “Needs attention”)
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - Failed
          - Pending
      responses:
        '200':
          description: Attention items, Failed first then Pending, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttentionItem'
                  page:
                    $ref: '#/components/schemas/PageInfo'
              example:
                items:
                - kind: NetBoxDevice
                  service: dcim
                  segment: devices
                  metadata:
                    name: rtr-bansko-03
                    namespace: default
                    uid: u1
                    creationTimestamp: '2026-08-01T10:00:00Z'
                  state: Failed
                  error: device type "CCR2004" not found in NetBox
                  since: '2026-09-08T08:30:00Z'
                page:
                  total: 46
                  nextCursor: eyJvIjo1MH0
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /kinds:
    get:
      operationId: list_kinds
      tags:
      - Discovery
      summary: Every resource kind the suite serves, with category, service and list path (replaces browser-side CRD discovery)
      security:
      - BearerAuth: []
      x-cors: inherit
      responses:
        '200':
          description: Kinds
          content:
            application/json:
              schema:
                type: object
                required:
                - kinds
                properties:
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/KindDescriptor'
              example:
                kinds:
                - kind: NetBoxPrefix
                  plural: netboxprefixes
                  category: ipam
                  service: ipam
                  segment: prefixes
                  listPath: /api/v1/ipam/prefixes
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /namespaces:
    get:
      operationId: list_namespaces
      tags:
      - Discovery
      summary: Namespaces the caller may read (header namespace selector)
      security:
      - BearerAuth: []
      x-cors: inherit
      responses:
        '200':
          description: Namespaces
          content:
            application/json:
              schema:
                type: object
                required:
                - namespaces
                properties:
                  namespaces:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                        resourceCount:
                          type: integer
              example:
                namespaces:
                - name: default
                  resourceCount: 1650
                - name: certificates
                  resourceCount: 5371
                - name: tenant-a
                  resourceCount: 61
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /events:
    get:
      operationId: list_events
      tags:
      - Events
      summary: Kubernetes Events for one resource (detail pages → History)
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          type: string
      - name: namespace
        in: query
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
              example:
                events:
                - type: Normal
                  reason: Reconciled
                  message: NetBoxPrefix reconciled successfully
                  count: 3
                  firstTimestamp: '2026-09-08T06:00:00Z'
                  lastTimestamp: '2026-09-08T08:41:12Z'
                  source: netbox-controller
        '404':
          description: No such resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: not_found
                message: No such resource
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /me:
    get:
      operationId: get_me
      tags:
      - Identity
      summary: Who the token says I am and which DCops roles I hold (sidebar footer, write-button gating)
      security:
      - BearerAuth: []
      x-cors: inherit
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                subject: oid-3f2a
                displayName: Charles
                email: charles@example.com
                roles:
                - dcops:certificates:import
                idp: https://login.microsoftonline.com/<tenant>/v2.0
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /healthz:
    get:
      operationId: healthz
      tags:
      - Health
      summary: Liveness
      security: []
      x-cors: inherit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
      x-brrtrouter-impl: true
components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
      properties:
        type:
          type: string
        status:
          type: string
          enum:
          - 'True'
          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: Total matching items
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page
    KindCount:
      type: object
      required:
      - kind
      - plural
      - segment
      - count
      properties:
        kind:
          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    CategoryCount:
      type: object
      required:
      - category
      - service
      - kinds
      - count
      properties:
        category:
          type: string
          enum:
          - ipam
          - dcim
          - tenancy
          - extras
          - boot
          - ippools
          - certificates
        service:
          type: string
          description: BFF service that serves the category
        kinds:
          type: integer
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    AttentionItem:
      type: object
      required:
      - kind
      - segment
      - service
      - metadata
      - state
      properties:
        kind:
          type: string
        service:
          type: string
        segment:
          type: string
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        since:
          type:
          - string
          - 'null'
          format: date-time
    Me:
      type: object
      required:
      - subject
      - displayName
      - roles
      properties:
        subject:
          type: string
        displayName:
          type: string
        email:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
          description: DCops roles after the claim→role mapping, e.g. dcops:certificates:import
        idp:
          type: string
          description: Issuer the token was validated against
    KindDescriptor:
      type: object
      required:
      - kind
      - plural
      - category
      - service
      - segment
      - listPath
      - description
      properties:
        kind:
          type: string
        plural:
          type: string
        category:
          type: string
        service:
          type: string
        segment:
          type: string
        listPath:
          type: string
          description: BFF path that lists this kind
        description:
          type: string
          description: Plain-language one-liner for empty states and the Docs page
  parameters:
    namespace:
      name: namespace
      in: query
      required: false
      description: Restrict to one namespace; absent = all namespaces the caller may read
      schema:
        type: string
    state:
      name: state
      in: query
      required: false
      description: Filter by reconciliation state
      schema:
        type: string
        enum:
        - Pending
        - Created
        - Updated
        - Failed
        description: Reconciliation state written by the controller
    search:
      name: search
      in: query
      required: false
      description: Case-insensitive match on name and the kind's primary field
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor from a previous page
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Field name, prefix with - for descending
      schema:
        type: string
        default: name
    pathNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    pathName:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token (Microsoft Entra ID or Sesame-IDAM); validated against the configured JWKS
