# Platform-managed tag (no tenant specified - uses system tenant token)
apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxTag
metadata:
  name: managed-by-dcops
  namespace: default
spec:
  name: "managed-by-dcops"
  slug: "managed-by-dcops"
  description: "Resource managed by DCops controller"
  color: "9e9e9e"
  comments: "Auto-managed tag"
  # No tenant specified - platform-managed tag

---
# Tenant-managed tag (uses datacenter-tenant's token)
apiVersion: dcops.microscaler.io/v1alpha1
kind: NetBoxTag
metadata:
  name: production
  namespace: default
spec:
  name: "production"
  slug: "production"
  description: "Production environment resources"
  color: "ff0000"
  comments: "Tag for production resources"
  # Tenant reference - tag will be managed using this tenant's NetBox API token
  tenant:
    apiGroup: dcops.microscaler.io
    kind: NetBoxTenant
    name: datacenter-tenant
    namespace: default

---
