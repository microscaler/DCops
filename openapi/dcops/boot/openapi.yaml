      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - name: lifecycle
        in: query
        required: false
        schema:
          type: string
        description: Filter by lifecycle
      - name: profile
        in: query
        required: false
        schema:
          type: string
        description: Filter by profile
      responses:
        '200':
          description: BootIntent rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootIntentList'
              example:
                items:
                - metadata:
                    name: boot-intent-1
                    namespace: default
                    uid: 2a1f0c7e-1
                    creationTimestamp: '2026-09-01T10:00:00Z'
                  state: Created
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  netboxId: 42
                  netboxUrl: http://netbox.netbox/api/bootintents/42/
                  spec:
                    lifecycle: discovered
                    macAddress: dc:a6:32:1f:04:9a
                    profileRef: example
                page:
                  total: 1
                  nextCursor: null
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /boot-intents/{namespace}/{name}:
    get:
      operationId: get_boot_intent
      tags:
      - BootIntent
      summary: Get one BootIntent with status, conditions and manifest
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/pathNamespace'
      - $ref: '#/components/parameters/pathName'
      responses:
        '200':
          description: BootIntent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootIntentDetail'
              example:
                apiVersion: dcops.microscaler.io/v1alpha1
                kind: BootIntent
                metadata:
                  name: boot-intent-1
                  namespace: default
                  uid: 2a1f0c7e-1
                  creationTimestamp: '2026-09-01T10:00:00Z'
                spec:
                  lifecycle: discovered
                  macAddress: dc:a6:32:1f:04:9a
                  profileRef:
                    name: example
                    namespace: example
                status:
                  configured: false
                  error: null
                  lastReconciled: '2026-09-08T08:41:12Z'
                  lifecycle: discovered
                conditions:
                - type: Ready
                  status: 'True'
                  reason: Reconciled
                  message: present in NetBox
                  lastTransitionTime: '2026-09-08T08:41:12Z'
                manifestYaml: |
                  apiVersion: dcops.microscaler.io/v1alpha1
                  kind: BootIntent
                  metadata:
                    name: boot-intent-1
                    namespace: default
                  spec:
                    lifecycle: discovered
                    macAddress: dc:a6:32:1f:04:9a
                    profileRef:
                      name: example
                      namespace: example
                gitUrl: null
        '404':
          description: No such resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: not_found
                message: No such resource
                requestId: req-01J9Z3Q8K7
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /summary:
    get:
      operationId: get_boot_summary
      tags:
      - Summary
      summary: Counts per kind and state for the boot section landing page
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Per-kind counts plus lifecycle distribution
          content:
            application/json:
              schema:
                type: object
                required:
                - kinds
                - total
                - lifecycle
                properties:
                  total:
                    type: integer
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/KindCount'
                  lifecycle:
                    $ref: '#/components/schemas/LifecycleCounts'
              example:
                total: 63
                kinds:
                - kind: BootProfile
                  plural: bootprofiles
                  segment: boot-profiles
                  count: 1
                  byState:
                    Created: 1
                - kind: BootIntent
                  plural: bootintents
                  segment: boot-intents
                  count: 1
                  byState:
                    Created: 1
                lifecycle:
                  discovered: 1
                  installing: 2
                  installed: 54
                  locked: 3
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable, safe to show to an Operations manager
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
        requestId:
          type: string
      examples:
      - code: not_found
        message: No NetBoxPrefix named control-plane-prefix in namespace default
        fields: []
        requestId: 01J7QZ3M8V2K
    ResourceMeta:
      type: object
      required:
      - name
      - namespace
      - uid
      - creationTimestamp
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        resourceVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Condition:
      type: object
      required:
      - type
      - status
      properties:
        type:
          type: string
        status:
          type: string
          enum:
          - 'True'
          - 'False'
          - Unknown
        reason:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        lastTransitionTime:
          type:
          - string
          - 'null'
          format: date-time
        observedGeneration:
          type:
          - integer
          - 'null'
    Event:
      type: object
      required:
      - type
      - reason
      - message
      - lastTimestamp
      properties:
        type:
          type: string
          enum:
          - Normal
          - Warning
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type:
          - string
          - 'null'
    PageInfo:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: Total matching items
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page
    KindCount:
      type: object
      required:
      - kind
      - plural
      - segment
      - count
      properties:
        kind:
          type: string
        plural:
          type: string
        segment:
          type: string
          description: Route segment under this service
        count:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
    State:
      type: string
      enum:
      - Pending
      - Created
      - Updated
      - Failed
      description: Reconciliation state written by the controller
    BootProfileSpec:
      properties:
        cmdline:
          default: ''
          description: Kernel command-line parameters
          type: string
        initrd:
          default: []
          description: Initrd image URLs or paths
          items:
            type: string
          type: array
        kernel:
          description: Kernel image URL or path
          type: string
        message:
          description: Boot message to display (optional)
          type:
          - string
          - 'null'
        schematicId:
          description: Talos Image Factory schematic ID (for Raspberry Pi custom images)
          type:
          - string
          - 'null'
      required:
      - kernel
      type: object
    BootProfileStatus:
      properties:
        lastReconciled:
          description: Last reconciliation timestamp
          format: date-time
          type:
          - string
          - 'null'
        ready:
          description: Whether the boot profile is ready
          type: boolean
      required:
      - ready
      type:
      - object
      - 'null'
    BootProfileRow:
      type: object
      required:
      - metadata
      - state
      - spec
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        netboxUrl:
          type:
          - string
          - 'null'
        spec:
          type: object
          description: Scalar spec fields for table columns
          properties:
            cmdline:
              default: ''
              description: Kernel command-line parameters
              type: string
            kernel:
              description: Kernel image URL or path
              type: string
            message:
              description: Boot message to display (optional)
              type:
              - string
              - 'null'
            schematicId:
              description: Talos Image Factory schematic ID (for Raspberry Pi custom images)
              type:
              - string
              - 'null'
        status:
          type: object
          properties:
            ready:
              description: Whether the boot profile is ready
              type: boolean
    BootProfileDetail:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: dcops.microscaler.io/v1alpha1
        kind:
          type: string
          const: BootProfile
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/BootProfileSpec'
        status:
          oneOf:
          - $ref: '#/components/schemas/BootProfileStatus'
          - type: 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        manifestYaml:
          type: string
          description: The declared resource as YAML (spec only), for the Manifest panel
        gitUrl:
          type:
          - string
          - 'null'
          description: Link to the declaring file in the GitOps repository when known
    BootProfileList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BootProfileRow'
        page:
          $ref: '#/components/schemas/PageInfo'
    BootIntentSpec:
      properties:
        lifecycle:
          default: discovered
          description: Lifecycle state
          enum:
          - discovered
          - installing
          - installed
          - locked
          type: string
        macAddress:
          description: MAC address of the machine
          type: string
        profileRef:
          description: Reference to BootProfile
          properties:
            name:
              description: Name of the BootProfile
              type: string
            namespace:
              description: Namespace (defaults to same namespace as BootIntent)
              type:
              - string
              - 'null'
          required:
          - name
          type: object
      required:
      - macAddress
      - profileRef
      type: object
    BootIntentStatus:
      properties:
        configured:
          description: Whether boot intent is configured
          type: boolean
        error:
          description: Error message if reconciliation failed
          type:
          - string
          - 'null'
        lastReconciled:
          description: Last reconciliation timestamp
          format: date-time
          type:
          - string
          - 'null'
        lifecycle:
          description: Current lifecycle state
          enum:
          - discovered
          - installing
          - installed
          - locked
          type: string
      required:
      - configured
      - lifecycle
      type:
      - object
      - 'null'
    BootIntentRow:
      type: object
      required:
      - metadata
      - state
      - spec
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        state:
          $ref: '#/components/schemas/State'
        error:
          type:
          - string
          - 'null'
        lastReconciled:
          type:
          - string
          - 'null'
          format: date-time
        netboxId:
          type:
          - integer
          - 'null'
          format: int64
        netboxUrl:
          type:
          - string
          - 'null'
        spec:
          type: object
          description: Scalar spec fields for table columns
          properties:
            lifecycle:
              default: discovered
              description: Lifecycle state
              enum:
              - discovered
              - installing
              - installed
              - locked
              type: string
            macAddress:
              description: MAC address of the machine
              type: string
            profileRef:
              type:
              - string
              - 'null'
              description: Reference to BootProfile (name of the referenced resource)
        status:
          type: object
          properties:
            configured:
              description: Whether boot intent is configured
              type: boolean
            lifecycle:
              description: Current lifecycle state
              enum:
              - discovered
              - installing
              - installed
              - locked
              type: string
    BootIntentDetail:
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: dcops.microscaler.io/v1alpha1
        kind:
          type: string
          const: BootIntent
        metadata:
          $ref: '#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/BootIntentSpec'
        status:
          oneOf:
          - $ref: '#/components/schemas/BootIntentStatus'
          - type: 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        manifestYaml:
          type: string
          description: The declared resource as YAML (spec only), for the Manifest panel
        gitUrl:
          type:
          - string
          - 'null'
          description: Link to the declaring file in the GitOps repository when known
    BootIntentList:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BootIntentRow'
        page:
          $ref: '#/components/schemas/PageInfo'
    LifecycleCounts:
      type: object
      properties:
        discovered:
          type: integer
        installing:
          type: integer
        installed:
          type: integer
        locked:
          type: integer
  parameters:
    namespace:
      name: namespace
      in: query
      required: false
      description: Restrict to one namespace; absent = all namespaces the caller may read
      schema:
        type: string
    state:
      name: state
      in: query
      required: false
      description: Filter by reconciliation state
      schema:
        type: string
        enum:
        - Pending
        - Created
        - Updated
        - Failed
        description: Reconciliation state written by the controller
    search:
      name: search
      in: query
      required: false
      description: Case-insensitive match on name and the kind's primary field
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor from a previous page
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Field name, prefix with - for descending
      schema:
        type: string
        default: name
    pathNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    pathName:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token (Microsoft Entra ID or Sesame-IDAM); validated against the configured JWKS
