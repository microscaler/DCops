name: Dependabot Automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Automerge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Skip major version updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "⚠️ Major version update detected - skipping automerge (requires manual review)"
          exit 0
      
      - name: Setup Rust
        if: steps.metadata.outputs.dependency-type == 'direct:production' || steps.metadata.outputs.dependency-type == 'direct:development'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Cargo dependencies
        if: steps.metadata.outputs.dependency-type == 'direct:production' || steps.metadata.outputs.dependency-type == 'direct:development'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run tests for Rust dependencies
        if: steps.metadata.outputs.dependency-type == 'direct:production' || steps.metadata.outputs.dependency-type == 'direct:development'
        run: |
          cargo test --workspace --lib --no-fail-fast || exit 1
      
      - name: Wait for status checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '.*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success,skipped
      
      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && success()
        run: |
          gh pr review --approve "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && success()
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
