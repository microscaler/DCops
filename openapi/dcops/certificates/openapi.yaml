  /bulk/ownership:
    post:
      operationId: bulk_assign_ownership
      tags:
      - Ownership
      summary: Assign ownership to many records by selector or name list; dryRun=true reports without writing. Requires role
        dcops:certificates:import.
      security:
      - BearerAuth: []
      x-cors: inherit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOwnershipRequest'
            example:
              selector:
                namespace: certificates
                state: Unowned
                severity: Critical
                businessUnit: METRO France
              ownership:
                team: Network
                contact: net-oncall@example.com
              bucket: legacy
              dryRun: true
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOwnershipResult'
              example:
                matched: 312
                updated: 300
                skipped: 12
                failed: []
                dryRun: true
                skippedReasons:
                - name: api.metro-vto.es
                  reason: spec.ownership.team is managed by kubectl (Git)
        '422':
          description: Selector and names both empty, or more than 2000 targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: invalid_selection
                message: Selector and names both empty, or more than 2000 targets
                requestId: req-01J9Z3Q8K7
