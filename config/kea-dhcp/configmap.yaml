apiVersion: v1
kind: ConfigMap
metadata:
  name: kea-dhcp-config
  namespace: dcops-system
  labels:
    app: kea-dhcp
data:
  kea-dhcp4.conf: |
    {
      "Dhcp4": {
        "interfaces-config": {
          "interfaces": ["*"]
        },
        "control-socket": {
          "socket-type": "unix",
          "socket-name": "/var/run/kea/kea4-ctrl-socket"
        },
        "lease-database": {
          "type": "memfile",
          "lfc-interval": 3600
        },
        "subnet4": [],
        "loggers": [
          {
            "name": "kea-dhcp4",
            "output-options": [
              {
                "output": "stdout"
              }
            ],
            "severity": "INFO",
            "debuglevel": 0
          }
        ]
      }
    }
  kea-ctrl-agent.conf: |
    {
      "Control-agent": {
        "http-host": "0.0.0.0",
        "http-port": 8000,
        "control-sockets": {
          "dhcp4": {
            "socket-type": "unix",
            "socket-name": "/var/run/kea/kea4-ctrl-socket"
          }
        }
      }
    }
