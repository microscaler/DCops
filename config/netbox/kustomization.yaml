apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netbox

resources:
  - namespace.yaml
  - netbox-db-credentials.yaml
  - netbox-deployment.yaml
  - netbox-service.yaml
  # Postgres and Redis are NOT deployed here — NetBox uses the shared-k8s
  # cluster's services in the `data` namespace (postgres.data / redis.data).

