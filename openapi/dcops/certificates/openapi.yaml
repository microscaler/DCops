openapi: 3.1.0
info:
  title: DCops — Certificates (inventory, ownership, maturity, scan imports)
  version: 0.1.0
  description: |-
    Certificates (inventory, ownership, maturity, scan imports). Paths are service-relative; the BFF adds /api/v1/certificates (bff-suite-config.yaml).
    Generated by openapi/dcops/scripts/build_specs.py from config/crd/all-crds.yaml and the screen contracts in
    docs/03_ui_design — do not edit by hand. Version policy: stay on 3.1.0.
tags:
- name: Inventory
- name: Ownership
- name: Maturity
- name: Imports
- name: Health
paths:
  /summary:
    get:
      operationId: get_certificates_summary
      tags:
      - Inventory
      summary: Headline tiles for the Certificates page
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatesSummary'
              example:
                total: 5368
                unowned: 2829
                renewalDue30d: 664
                drift: 12
                failed: 4
                stale: 41
                estateLevel: 1
                byBucket:
                  fast-track: 3211
                  legacy: 1172
                  unclassified: 985
                refreshedAt: '2026-09-08T08:41:12Z'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: forbidden
                message: Token lacks the required role
                requestId: req-01J9Z3Q8K7
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: internal
                message: Unexpected error
                requestId: req-01J9Z3Q8K7
      x-brrtrouter-impl: true
  /inventory:
    get:
      operationId: list_certificates
      tags:
      - Inventory
      summary: Inventory table rows, filtered and paged (served from the controller reflector, not raw Kubernetes selectors)
      security:
      - BearerAuth: []
      x-cors: inherit
      parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/sort'
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CertState'
      - name: bucket
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Bucket'
      - name: owner
        in: query
        required: false
        schema:
          type: string
        description: Owner team; "none" for unowned
      - name: businessUnit
        in: query
        required: false
        schema:
          type: string
      - name: severity
        in: query
        required: false
        schema:
          type: string
      - name: expiringWithinDays
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateList'
              example:
                items:
                - name: www-dev.metro-vto.es
                  namespace: certificates
                  bucket: legacy
                  issuanceMode: external
                  issuer: Sectigo Limited
                  daysRemaining: 6
                  notAfter: '2026-09-14T23:59:59Z'
                  state: Renewal due
                  ownerTeam: Network
                  severity: Critical
                  maturityLevel: 2
                  acknowledged: false
                page:
                  total: 5368
                  nextCursor: eyJvIjo1MH0
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: unauthenticated
                message: Missing or invalid bearer token
                requestId: req-01J9Z3Q8K7
        '403':
          description: Token lacks the required role
          content:
            application/json:
              schema:
